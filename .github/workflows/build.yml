name: Build Makers APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          if [ -f "makers_proj (1).zip" ]; then unzip -o "makers_proj (1).zip" -d src; else unzip -o makers_proj.zip -d src; fi
          ls -la src/proj

      - name: Build web + Android project
        working-directory: src/proj
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: src/proj/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: makers-${{ github.run_number }}
          name: Makers test build ${{ github.run_number }}
          files: src/proj/android/app/build/outputs/apk/debug/app-debug.apk
